name: site-ci

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Type check
        run: npm run check

      # Map/slope charts and boundary files (node's test runner).
      - name: Test
        run: npm test

      # Builds the static site and runs scripts/check-dist.mjs (legacy URLs, no samples, no keys).
      - name: Build
        run: npm run build
