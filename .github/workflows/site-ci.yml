name: site-ci

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # On failure, surface npm's error as an annotation (readable from the run summary).
      - name: Install
        run: |
          npm ci 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=npm ci failed::$(grep -E 'npm error' "$RUNNER_TEMP/npm-ci.log" | head -20 | tr '
' ' ' | cut -c1-3000)"
            exit "$status"
          fi

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Type check
        run: npm run check

      # Builds the static site and runs scripts/check-dist.mjs (legacy URLs, no samples, no keys).
      - name: Build
        run: npm run build
