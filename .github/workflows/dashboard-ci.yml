name: dashboard-ci

on:
  pull_request:
    paths:
      - "dashboard/**"
      - "worker/tests/golden/**"
      - ".github/workflows/dashboard-ci.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "worker/tests/golden/**"
      - ".github/workflows/dashboard-ci.yml"

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and type check
        run: |
          npm run lint
          npm run typecheck

      # Golden vectors (TypeScript port must match Python) and the Access JWT checks.
      - name: Tests
        run: npm test

      # Same build Cloudflare runs; fails if any secret name or value is bundled.
      - name: Cloudflare build (guarded)
        run: npm run build:cf
