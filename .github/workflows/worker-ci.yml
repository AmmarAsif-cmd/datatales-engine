name: worker-ci

on:
  pull_request:
    paths:
      - "worker/**"
      - "site/src/data/geo/**"
      - ".github/workflows/worker-ci.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "site/src/data/geo/**"
      - ".github/workflows/worker-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "worker/uv.lock"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
