name: discovery

# Dataset discovery on demand (the dashboard's "Find new datasets now" button):
# data.gov.uk + ONS catalogue metadata -> hard filters -> Claude scores (Haiku) -> the best few
# added to the backlog as `suggested`. The weekly run is the first step of pipeline.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "worker/uv.lock"

      - name: Discover datasets
        working-directory: worker
        run: |
          uv sync --locked
          uv run python -m datatales discover
