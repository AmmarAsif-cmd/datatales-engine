version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/worker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
    ignore:
      # @astrojs/check supports TypeScript ^5 || ^6 only; revisit when it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm entry for /dashboard is added in M6 once its package.json exists.
