version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/worker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
    ignore:
      # @astrojs/check supports TypeScript ^5 || ^6 only; revisit when it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom"]
    ignore:
      # @opennextjs/cloudflare 1.20.10 crashes at runtime with Next 16.4 (preview-props.json is
      # not inlined -> error 1101). Stay on 16.3.x until an adapter release supports 16.4; the
      # dashboard CI smoke test proves it before unpinning.
      - dependency-name: "next"
        versions: [">=16.4.0"]
      - dependency-name: "eslint-config-next"
        versions: [">=16.4.0"]
