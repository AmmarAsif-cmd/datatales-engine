# Approved by Ammar Asif at 2026-11-02T20:59:17.388036+00:00.
# Do not edit: approved recipes are immutable. Import a new version instead.
source: deaths-registered-weekly-in-england-and-wales-by-region
version: 1
description: Weekly deaths registered in England and Wales by region (ONS) and cause of death, for 2025
  and 2026. One row per region, year, week and cause of death. Duplicate slug columns (calendar-years,
  administrative-geography, week-number, cause-of-death) are dropped in favour of label columns, with
  the area code kept for geography. Values marked x in the Data Marking column are suppressed and become
  null. The Data Marking column is dropped after parsing. A geo_level column is derived from the ONS geography
  code (England is country level, others are regions). Counts are not converted to shares because the
  cause categories are overlapping and there is no Total row.
steps:
- op: drop_columns
  columns:
  - Data Marking
  - calendar-years
  - week-number
  - cause-of-death
- op: rename_columns
  mapping:
    Time: year
    Week: week
    v4_1: deaths
    Geography: area
    CauseOfDeath: cause_of_death
    administrative-geography: area_code
- op: parse_number
  columns:
  - deaths
  markers:
  - x
- op: classify_prefix
  column: area_code
  into: geo_level
  mapping:
    E06: local_authority
    E07: local_authority
    E08: local_authority
    E09: local_authority
    E10: county
    E11: metropolitan_county
    E12: region
    E13: london_inner_outer
    E92: country
    K02: uk
    K03: great_britain
    N09: local_authority
    N92: country
    S12: local_authority
    S92: country
    W06: local_authority
    W92: country
  default: other
- op: cast
  columns:
    year: int
- op: select_columns
  columns:
  - area_code
  - area
  - geo_level
  - year
  - week
  - cause_of_death
  - deaths
checks:
  expected_columns:
  - area_code
  - area
  - geo_level
  - year
  - week
  - cause_of_death
  - deaths
  row_count:
    min: 6000
    max: 10000
  not_null:
  - area_code
  - area
  - geo_level
  - year
  - week
  - cause_of_death
  unique:
  - area_code
  - year
  - week
  - cause_of_death
  ranges:
    year:
      min: 2025.0
      max: 2026.0
    deaths:
      min: 0.0
      max: 20000.0
