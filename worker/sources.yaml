# Data sources. `python -m datatales sources-sync` upserts these into the `sources` table.
# fetch.type:
#   ons_api - latest version of an ONS API dataset (CSV download)
#   upload  - a file you place in worker/data/inbox/ and ingest with --file
sources:
  - slug: ons-wellbeing-local-authority
    name: Personal well-being estimates by local authority
    publisher: Office for National Statistics
    url: https://www.ons.gov.uk/datasets/wellbeing-local-authority
    licence: Open Government Licence v3.0
    refresh_schedule: annual
    relatability: 5
    fetch:
      type: ons_api
      dataset_id: wellbeing-local-authority
      edition: time-series
    # How detectors read the clean table (M4). Comparisons only happen within one slice
    # (same measure, estimate and geography level).
    detect:
      group: geography
      group_code: geo_code
      period: year_start
      period_label: period
      value: value
      lower: lower_ci
      upper: upper_ci
      slice_by: [measure, estimate, geo_level]
      filters:
        is_reliable: [true]
        # First batch: UK, countries and regions only (user, 2026-10-10).
        # Add local_authority after the first findings are reviewed.
        geo_level: [uk, country, region]
        estimate: [Average (mean), Poor, Very good]
      units:
        - when: {estimate: [Average (mean)]}
          unit: average score out of 10
        - when: {estimate: [Poor, Very good]}
          unit: "% of people"
      # Default: higher is better. For anxiety the mean and the Poor band (= high anxiety)
      # are worse when higher; Poor is worse when higher for every measure.
      top_n: 20  # findings kept per clean table; the story shortlist keeps the top 5 candidates
      # Plain-English labels for key-number cards ({measure} is replaced, lower-cased).
      # First matching rule wins. Anxiety bands are reversed: Poor = high anxiety.
      labels:
        - when: {estimate: [Average (mean)]}
          label: "Average {measure} score"
        - when: {measure: [Anxiety], estimate: [Poor]}
          label: "Share with high anxiety"
        - when: {measure: [Anxiety], estimate: [Very good]}
          label: "Share with very low anxiety"
        - when: {estimate: [Poor]}
          label: "Share with low {measure}"
        - when: {estimate: [Very good]}
          label: "Share with very high {measure}"
      polarity:
        - when: {measure: [Anxiety], estimate: [Average (mean)]}
          higher_is_better: false
        - when: {estimate: [Poor]}
          higher_is_better: false
