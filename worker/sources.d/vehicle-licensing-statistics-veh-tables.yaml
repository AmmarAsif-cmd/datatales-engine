# Generated by the weekly new-dataset step (worker/datatales/newsource.py) from the
# dataset backlog. `detect` is filled in when you approve the recipe.
slug: vehicle-licensing-statistics-veh-tables
name: Vehicle licensing statistics (VEH tables)
publisher: Department for Transport
url: https://www.gov.uk/government/statistical-data-sets/vehicle-licensing-statistics-data-tables
licence: Open Government Licence v3.0
refresh_schedule: quarterly
relatability: 3
caveats:
- The figures count licensed cars kept by private individuals at the end of each quarter
  (Q2 means the end of June). Company cars are left out because DfT counts them at
  the company's registered address, which for leasing and rental fleets is often far
  from where the cars are used.
- Cars are counted at the registered keeper's postcode, which is not necessarily where
  the car is driven.
- In this table DfT groups fuel as petrol, diesel, petrol hybrid and other fuel types.
  Other fuel types covers every fuel not in the first three, including fully electric
  cars; DfT publishes electric vehicles in more detail in a separate table (VEH0142).
- The series here starts in 2014 Q3, the first quarter the table covers the whole
  UK, including Northern Ireland.
- The data shows which cars are licensed, not how far they are driven or why people
  chose them.
fetch:
  type: catalogue_file
  kind: govuk
  page_url: https://www.gov.uk/government/statistical-data-sets/vehicle-licensing-statistics-data-tables
  file_match: veh0105
  format: ODS
backlog_id: fb2f4bb5-c10d-4aad-906c-73717616bdd5
detect:
  group: geography
  group_code: ons_code
  period: quarter_start
  period_label: quarter
  value: fuel_share_pct
  precision_pct: 2.0
  slice_by:
  - body_type
  - fuel_type
  - geo_level
  filters:
    geo_level:
    - country
    - region
    keepership:
    - Private
    body_type:
    - Cars
    fuel_type:
    - Petrol
    - Diesel
    - Hybrid electric (petrol)
    - Other fuel types
  units:
  - when:
      body_type:
      - Cars
    unit: '% of privately kept cars'
  default_unit: '% of privately kept cars'
  polarity:
  - when:
      fuel_type:
      - Petrol
      - Diesel
    higher_is_better: false
  labels:
  - when:
      fuel_type:
      - Petrol
    label: 'Share of private cars: petrol'
  - when:
      fuel_type:
      - Diesel
    label: 'Share of private cars: diesel'
  - when:
      fuel_type:
      - Hybrid electric (petrol)
    label: 'Share of private cars: petrol hybrids'
  - when:
      fuel_type:
      - Other fuel types
    label: 'Share of private cars: other fuel types'
  default_higher_is_better: true
  min_groups_rank: 3
  min_groups_outlier: 5
  outlier_z: 2.5
  top_n: 20
